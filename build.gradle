plugins {
    id 'java'
}

group 'com.raytracer'
version '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

ext {
    javaVersion = JavaVersion.VERSION_11
    lwjglVersion = "3.3.3"
    // For now, we'll use windows natives as a placeholder.
    // User can modify this later if needed.
    lwjglNatives = "natives-windows"
}

dependencies {
    implementation platform("org.lwjgl:lwjgl-bom:$lwjglVersion")

    implementation "org.lwjgl:lwjgl"
    implementation "org.lwjgl:lwjgl-glfw"
    implementation "org.lwjgl:lwjgl-opengl"

    runtimeOnly "org.lwjgl:lwjgl::$lwjglNatives"
    runtimeOnly "org.lwjgl:lwjgl-glfw::$lwjglNatives"
    runtimeOnly "org.lwjgl:lwjgl-opengl::$lwjglNatives"
}

java {
    sourceCompatibility = ext.javaVersion
    targetCompatibility = ext.javaVersion
}

jar {
    manifest {
        attributes(
                'Main-Class': 'com.raytracer.Main' // Optional: Define main class
        )
    }
}

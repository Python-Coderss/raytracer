plugins {
    id 'java'
    id 'application' // Added for mainClassName and 'run' task
    id 'com.github.johnrengelman.shadow' version '5.2.0' // Compatible with Gradle 4.1+
}

group 'com.raytracer'
version '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

ext {
    javaVersion = JavaVersion.VERSION_11 // Ensure this is used for source/targetCompatibility
    lwjglVersion = "3.3.3"
    // No need for lwjglNatives variable here if we list all platform natives explicitly
}

dependencies {
    implementation "org.lwjgl:lwjgl:$lwjglVersion"
    implementation "org.lwjgl:lwjgl-glfw:$lwjglVersion"
    implementation "org.lwjgl:lwjgl-opengl:$lwjglVersion"

    // LWJGL natives for all common platforms for a more complete fat JAR
    runtimeOnly "org.lwjgl:lwjgl:$lwjglVersion:natives-windows"
    runtimeOnly "org.lwjgl:lwjgl-glfw:$lwjglVersion:natives-windows"
    runtimeOnly "org.lwjgl:lwjgl-opengl:$lwjglVersion:natives-windows"

    runtimeOnly "org.lwjgl:lwjgl:$lwjglVersion:natives-linux"
    runtimeOnly "org.lwjgl:lwjgl-glfw:$lwjglVersion:natives-linux"
    runtimeOnly "org.lwjgl:lwjgl-opengl:$lwjglVersion:natives-linux"

    runtimeOnly "org.lwjgl:lwjgl:$lwjglVersion:natives-macos"
    runtimeOnly "org.lwjgl:lwjgl-glfw:$lwjglVersion:natives-macos"
    runtimeOnly "org.lwjgl:lwjgl-opengl:$lwjglVersion:natives-macos"
}

// Configure Java compilation options for Gradle 4.4.1
sourceCompatibility = ext.javaVersion
targetCompatibility = ext.javaVersion
// The java { ... } block might not be needed or recognized in this form by Gradle 4.4.1
// If other java specific configurations were here, they'd need different syntax.

jar {
    manifest {
        attributes(
            'Main-Class': 'com.raytracer.Main'
        )
    }
}

// To make `./gradlew run` work with the main class via the application plugin
application {
    mainClassName = 'com.raytracer.Main'
}

// Optional: Further configure shadowJar if needed
// shadowJar {
//    archiveClassifier = 'fat' // Example: myproject-1.0-SNAPSHOT-fat.jar
// }
